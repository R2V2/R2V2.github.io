<script>
var colors = ['black', 'white'];

$(document).ready(function () {
    $colorDiv = $('#coloredDiv');
    ln = colors.length;
    $('.clickMe').on("click", function () {
        var i = $colorDiv.data("index");
        ++i;
        if (i >= ln) i = 0;
        $colorDiv.css({
            'background-color': colors[i]
        });
        $colorDiv.data("index", i);
    });
});
</script>
<script>
  function cycletext()
  {document.getElementById('foo').innerHTML = nextWord();
}
</script>
